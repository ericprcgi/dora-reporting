name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify FI schema files (SHA-256)
        run: python -m dora_reporting.cli checksums
      - name: Run tests
        run: python -m pytest --junitxml=out/junit.xml
      - name: Generate the INC0009817 report and validate against FI v2
        if: ${{ !cancelled() }}
        run: python -m dora_reporting.cli generate --incident INC0009817 --source fixture --schema v2 --out out
      - name: Write summary
        if: ${{ !cancelled() }}
        run: |
          python tools/write_summary.py tests out/junit.xml >> "$GITHUB_STEP_SUMMARY"
          python tools/write_summary.py validation out/validation-v2.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-check
          path: out/

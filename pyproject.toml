[project]
name = "dora-reporting"
version = "1.3.0"
description = "DORA major incident reports (Initial) for Finansinspektionen, generated from ServiceNow"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# xunit1 keeps the fi_source properties in the JUnit report (see tests/conftest.py)
junit_family = "xunit1"
markers = [
    "fi_source(text): the FI requirement and source that the test verifies, as '<source>: <requirement>'",
]
